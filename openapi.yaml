openapi: 3.0.3
info:
  title: Inventory API
  version: 1.0.0
  description: Real-time inventory tracking with JWT auth, RBAC, and WebSocket broadcasts.

servers:
  - url: http://localhost:6996

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        role: { type: integer, description: "0=Admin, 1=TeamLead, 2=Member, 3=Adhoc" }
    Item:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        sku: { type: string }
        category: { type: string }
        total_quantity: { type: integer }
        available_quantity: { type: integer }
    Error:
      type: object
      properties:
        error: { type: string }

paths:
  /auth/register:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, password]
              properties:
                name: { type: string }
                password: { type: string }
                role: { type: integer }
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400":
          description: Invalid request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/login:
    post:
      summary: Log in and receive a JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, password]
              properties:
                name: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user: { $ref: "#/components/schemas/User" }
        "401":
          description: Invalid credentials

  /inventory:
    get:
      summary: List all inventory items
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: List of items
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Item" }
    post:
      summary: Create an inventory item (admin only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, category, total_quantity]
              properties:
                name: { type: string }
                category: { type: string }
                total_quantity: { type: integer }
      responses:
        "201":
          description: Item created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "403":
          description: Insufficient permissions

  /inventory/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Get a single item
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Item found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "404":
          description: Not found
    put:
      summary: Update an item (admin only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                total_quantity: { type: integer }
      responses:
        "200":
          description: Item updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
    delete:
      summary: Delete an item (admin only)
      security: [{ bearerAuth: [] }]
      responses:
        "204":
          description: Deleted

  /inventory/{id}/checkout:
    post:
      summary: Check out an item (decrements available quantity, broadcasts stock_updated over WS)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                quantity: { type: integer, default: 1 }
      responses:
        "200":
          description: Checkout successful
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "409":
          description: Not enough stock available

  /inventory/{id}/checkin:
    post:
      summary: Check in an item (increments available quantity, broadcasts stock_updated over WS)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                quantity: { type: integer, default: 1 }
      responses:
        "200":
          description: Checkin successful
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }

  /inventory/analytics:
    get:
      summary: Top 3 most checked-out items and low-stock items (available_quantity < 2)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Analytics data
          content:
            application/json:
              schema:
                type: object
                properties:
                  top_checked_out:
                    type: array
                    items:
                      type: object
                      properties:
                        item_id: { type: string, format: uuid }
                        name: { type: string }
                        checkout_count: { type: integer }
                  low_stock:
                    type: array
                    items: { $ref: "#/components/schemas/Item" }